name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, compilación y pruebas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: portafolio
          POSTGRES_PASSWORD: solo-para-ci
          POSTGRES_DB: portafolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portafolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://portafolio:solo-para-ci@localhost:5432/portafolio_test?schema=public
      TEST_DATABASE_URL: postgresql://portafolio:solo-para-ci@localhost:5432/portafolio_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
